<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokopia Habitat Planner</title>
<!--
================================================================================
  POKOPIA HABITAT PLANNER
================================================================================
  A planning companion for Pokémon Pokopia habitat building.
  Single-file app: all data, styles, and logic live in this file.

  TABLE OF CONTENTS (search for the section tag to jump):
    [S1] DESIGN TOKENS ......... CSS custom properties (colors, radii, motion)
    [S2] BASE & LAYOUT ......... resets, page scaffold, header, tabs
    [S3] COMPONENTS ............ pickers, chips, cards, buttons, tags
    [S4] ANIMATIONS ............ keyframes + transition helpers
    [S5] MARKUP ................ page structure (planner + browse screens)
    [S6] DATA:POKEMON .......... const POKOPIA_DATA (308 entries)
    [S7] DATA:FAVORITES ........ const FAVORITES_ITEMS (43 categories)
    [S8] DATA:FLAVORS .......... const FLAVOR_FOODS (5 flavors, feeding)
    [S8b] DATA:FURNITURE TYPES  item -> crafting category + name aliases
    [S8c] DATA:LITTER DROPS ..... which material each Litter Pokémon drops
    [S9] DERIVED INDEXES ....... reverse maps built from data at load
    [S10] STATE ................ mutable app state (selection)
    [S11] LOGIC ................ pure functions (no DOM): conflicts,
                                 coverage, suggestions
    [S12] RENDER ............... DOM rendering functions
    [S13] EVENTS & INIT ........ listeners, boot sequence

  MAINTENANCE RULES:
    - Data updates: ONLY touch [S6]-[S8]. Never let a data update modify
      code sections. Rebuild via build script if in doubt.
    - Run validate_planner.js before shipping any change.
    - Logic functions in [S11] must stay DOM-free (testable in Node).
================================================================================
-->
<style>
/* ============================================================
   [S1] DESIGN TOKENS — Pokopia-inspired cozy nature palette
   ============================================================ */
:root{
  /* palette: warm meadow greens + cream + earth */
  --meadow:      #6fae5c;   /* primary green, leafy */
  --meadow-deep: #4d8a3d;   /* darker green, headers/active */
  --meadow-soft: #e7f2df;   /* pale green wash, hovers/fills */
  --cream:       #faf6ec;   /* page background, warm paper */
  --card:        #ffffff;   /* card surfaces */
  --bark:        #5a4a3a;   /* primary text, warm brown */
  --bark-soft:   #9a8b7a;   /* secondary text */
  --line:        #e8e0d0;   /* soft borders */
  --line-strong: #d5c9b4;   /* stronger borders */
  --sun:         #e8a53c;   /* warm accent: partial/status */
  --sun-soft:    #fdf3e0;
  --berry:       #d96a5f;   /* warnings, remove actions */
  --berry-soft:  #fbeae8;
  --sky:         #6aa7c8;   /* info accent, water-ish */
  --sky-soft:    #e9f3f9;

  /* shape */
  --r-lg: 16px;
  --r-md: 11px;
  --r-sm: 8px;
  --r-pill: 999px;

  /* motion */
  --ease: cubic-bezier(0.25, 0.7, 0.35, 1);
  --t-fast: 0.15s;
  --t-med: 0.28s;

  /* elevation */
  --shadow-card: 0 1px 3px rgba(90,74,58,0.07), 0 4px 14px rgba(90,74,58,0.05);
  --shadow-float: 0 2px 6px rgba(90,74,58,0.10), 0 8px 24px rgba(90,74,58,0.08);
}

/* ============================================================
   [S2] BASE & LAYOUT
   ============================================================ */
*{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background:
    radial-gradient(1200px 500px at 85% -10%, #eef5e4 0%, transparent 60%),
    radial-gradient(900px 400px at -10% 20%, #f6efdd 0%, transparent 55%),
    var(--cream);
  color:var(--bark);
  min-height:100vh;
  font-size:14px;
  line-height:1.45;
}
main{ max-width:680px; margin:0 auto; padding:14px 14px 60px; }

/* header */
header{
  max-width:680px; margin:0 auto; padding:18px 16px 4px;
  display:flex; flex-direction:column; gap:12px;
}
.brand h1{
  font-size:21px; font-weight:800; letter-spacing:-0.02em;
  color:var(--meadow-deep);
}
.brand .sub{ font-size:11px; color:var(--bark-soft); margin-top:1px; }

/* tabs */
.tabs{
  display:flex; gap:6px; background:rgba(255,255,255,0.65);
  border:1px solid var(--line); border-radius:var(--r-pill); padding:4px;
  backdrop-filter: blur(4px);
}
.tabs button{
  flex:1; border:none; background:transparent; cursor:pointer;
  font-size:12.5px; font-weight:700; color:var(--bark-soft);
  padding:8px 10px; border-radius:var(--r-pill);
  transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.tabs button:hover{ color:var(--meadow-deep); }
.tabs button.active{
  background:var(--meadow); color:#fff;
  box-shadow: inset 0 -2px 0 rgba(0,0,0,0.06);
}

/* screens */
.screen{ display:none; }
.screen.active{ display:block; animation: screenIn var(--t-med) var(--ease); }

/* section blocks */
section.block{
  background:var(--card); border:1px solid var(--line);
  border-radius:var(--r-lg); padding:16px; margin-top:14px;
  box-shadow: var(--shadow-card);
}
section.block > .block-title,
.block-title{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:11px; font-weight:800; text-transform:uppercase;
  letter-spacing:0.07em; color:var(--meadow-deep); margin-bottom:10px;
}
.block-title span:last-child{
  font-weight:600; color:var(--bark-soft); text-transform:none; letter-spacing:0;
}

/* ============================================================
   [S3] COMPONENTS
   ============================================================ */

/* search input */
.picker-search{
  width:100%; padding:11px 14px; font-size:14px;
  border:1.5px solid var(--line-strong); border-radius:var(--r-md);
  background:#fff; color:var(--bark); outline:none;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.picker-search::placeholder{ color:var(--bark-soft); }
.picker-search:focus{
  border-color:var(--meadow);
  box-shadow: 0 0 0 3px var(--meadow-soft);
}

/* picker list */
.picker-list{
  max-height:250px; overflow-y:auto; margin-top:8px;
  border:1px solid var(--line); border-radius:var(--r-md); background:#fff;
}
.picker-row{
  display:flex; align-items:center; gap:9px;
  padding:9px 12px; cursor:pointer; font-size:13px;
  border-bottom:1px solid var(--line);
  transition: background var(--t-fast) var(--ease);
}
.picker-row:last-child{ border-bottom:none; }
.picker-row:hover{ background:var(--meadow-soft); }
.picker-row .num{ color:var(--bark-soft); font-size:10px; width:32px; flex-shrink:0; }
.picker-row input[type=checkbox]{
  flex-shrink:0; accent-color:var(--meadow); width:16px; height:16px; cursor:pointer;
}
.picker-row .name{ flex:1; font-weight:600; }
.picker-row .hab-pole{
  font-size:9px; font-weight:700; padding:2px 8px; border-radius:var(--r-pill);
  background:var(--sky-soft); color:var(--sky); flex-shrink:0;
}
.picker-row .litter-tag{
  font-size:9px; font-weight:700; padding:2px 8px; border-radius:var(--r-pill);
  background:var(--meadow-soft); color:var(--meadow-deep); flex-shrink:0;
}

/* selected chips */
.target-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; min-height:26px; }
.chip{
  display:flex; align-items:center; gap:5px;
  background:var(--meadow-deep); color:#fff;
  padding:5px 9px 5px 12px; border-radius:var(--r-pill); font-size:11.5px; font-weight:600;
  animation: chipIn var(--t-med) var(--ease);
}
.chip button{
  background:none; border:none; color:#fff; cursor:pointer;
  font-size:13px; line-height:1; padding:0 2px; opacity:0.65;
  transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.chip button:hover{ opacity:1; transform:scale(1.15); }
.chip.chip-caution{ background:var(--sun); }
.empty-hint{ font-size:11.5px; color:var(--bark-soft); font-style:italic; }

/* saved habitats */
.habitat-save-row{ display:flex; gap:8px; }
.habitat-name-input{
  flex:1; padding:9px 12px; font-size:13px;
  border:1.5px solid var(--line-strong); border-radius:var(--r-md);
  background:#fff; color:var(--bark); outline:none;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.habitat-name-input:focus{ border-color:var(--meadow); box-shadow:0 0 0 3px var(--meadow-soft); }
.habitat-save-btn{
  flex-shrink:0; background:var(--meadow); color:#fff; border:none;
  border-radius:var(--r-md); padding:9px 16px; font-size:12px; font-weight:700; cursor:pointer;
  transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.habitat-save-btn:hover{ background:var(--meadow-deep); }
.habitat-save-btn:active{ transform:scale(0.96); }
.habitat-save-btn:disabled{ opacity:0.45; cursor:default; }
.habitat-row{
  display:flex; align-items:center; gap:8px;
  border:1px solid var(--line); border-radius:var(--r-md);
  padding:8px 11px; margin-top:7px; background:#fff;
  transition: border-color var(--t-fast) var(--ease);
  animation: rowIn var(--t-med) var(--ease);
}
.habitat-row:hover{ border-color:var(--meadow); }
.habitat-row .hr-info{ flex:1; min-width:0; cursor:pointer; }
.habitat-row .hr-name{ font-size:12.5px; font-weight:700; }
.habitat-row .hr-mons{
  font-size:9.5px; color:var(--bark-soft); margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.habitat-row .hr-load{
  flex-shrink:0; background:var(--meadow-soft); color:var(--meadow-deep); border:none;
  border-radius:var(--r-pill); padding:6px 13px; font-size:11px; font-weight:700; cursor:pointer;
  transition: background var(--t-fast) var(--ease);
}
.habitat-row .hr-load:hover{ background:var(--meadow); color:#fff; }
.habitat-row .hr-del{
  flex-shrink:0; background:none; border:none; cursor:pointer; font-size:13px;
  color:var(--bark-soft); padding:4px 6px; border-radius:var(--r-sm);
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
}
.habitat-row .hr-del:hover{ color:var(--berry); background:var(--berry-soft); }

/* coverage bar */
.coverage-bar{
  display:flex; height:9px; border-radius:var(--r-pill); overflow:hidden;
  background:var(--line); margin-top:4px;
}
.coverage-bar .seg{ transition: width var(--t-med) var(--ease); }
.coverage-bar .seg.covered{ background:var(--meadow); }
.coverage-bar .seg.gap{ background:var(--sun); }
.coverage-stats{
  display:flex; justify-content:space-between;
  font-size:10px; color:var(--bark-soft); margin-top:5px;
}

/* item result cards (favorites) */
.item-result{
  border:1px solid var(--line); border-radius:var(--r-md);
  margin-bottom:7px; background:#fff; overflow:hidden;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  animation: rowIn var(--t-med) var(--ease);
}
.item-result:hover{ border-color:var(--meadow); }
.item-result .item-head{
  display:flex; justify-content:space-between; align-items:center; gap:8px;
  padding:11px 13px; cursor:pointer;
  transition: background var(--t-fast) var(--ease);
}
.item-result .item-head:hover{ background:var(--meadow-soft); }
.item-result .item-name{ font-size:13.5px; font-weight:700; }
.item-result .item-meta{ font-size:9.5px; color:var(--bark-soft); margin-top:2px; }
.item-result .item-body{
  display:none; padding:0 13px 12px;
}
.item-result.expanded .item-body{ display:block; animation: bodyIn var(--t-med) var(--ease); }
.item-result .chev{
  flex-shrink:0; color:var(--bark-soft); font-size:11px;
  transition: transform var(--t-med) var(--ease);
}
.item-result.expanded .chev{ transform:rotate(180deg); }

.fav-status{
  flex-shrink:0; font-size:9px; font-weight:800; text-transform:uppercase;
  letter-spacing:0.04em; padding:3px 9px; border-radius:var(--r-pill);
}
.fav-status.ok{ background:var(--meadow-soft); color:var(--meadow-deep); }
.fav-status.partial{ background:var(--sun-soft); color:var(--sun); }

.fav-tag-row{ display:flex; flex-wrap:wrap; gap:4px; margin:6px 0; }
.fav-tag{
  font-size:9.5px; font-weight:600; padding:3px 8px; border-radius:var(--r-pill);
  background:var(--meadow); color:#fff;
}
.mon-tag-row{ display:flex; flex-wrap:wrap; gap:4px; }
.mon-tag{
  font-size:9.5px; padding:3px 8px; border-radius:var(--r-pill);
  background:var(--cream); border:1px solid var(--line-strong); color:var(--bark);
}
.ft-badge{
  display:inline-block; margin-left:5px; padding:1px 5px; border-radius:var(--r-pill);
  background:var(--sky-soft); color:var(--sky); font-size:8px; font-weight:700;
  text-transform:uppercase; letter-spacing:0.03em; vertical-align:1px;
}
.item-note{ font-size:9.5px; color:var(--bark-soft); font-style:italic; margin-top:7px; }

/* flavor & specialty per-pokemon cards */
.flavor-spec-mon{
  margin-bottom:10px; animation: rowIn var(--t-med) var(--ease);
}
.flavor-spec-mon .fsm-head{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;
}
.flavor-spec-mon .item-name{ font-size:13.5px; font-weight:700; }
.remove-mon-btn{
  background:none; border:none; cursor:pointer; font-size:14px;
  color:var(--bark-soft); padding:3px 6px; line-height:1; border-radius:var(--r-sm);
  transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.remove-mon-btn:hover{ color:var(--berry); background:var(--berry-soft); transform:scale(1.1); }
.flavor-spec-row{ display:flex; gap:8px; }
.flavor-spec-box{
  flex:1; display:flex; flex-direction:column; gap:6px;
  border:1px solid var(--line); border-radius:var(--r-md);
  padding:9px 11px; background:var(--cream);
}
.flavor-spec-label{
  font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--bark-soft);
}

/* conflict callout */
.conflict-callout{
  border:1.5px solid var(--sun); background:var(--sun-soft);
  border-radius:var(--r-md); padding:12px 14px;
  animation: rowIn var(--t-med) var(--ease);
}
.conflict-callout .ct{
  font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--sun); margin-bottom:6px;
}
.conflict-callout .cx{ font-size:12px; line-height:1.55; }
.ok-callout{
  border:1.5px solid var(--meadow); background:var(--meadow-soft);
  border-radius:var(--r-md); padding:10px 14px; font-size:12px;
  color:var(--meadow-deep); font-weight:600;
  animation: rowIn var(--t-med) var(--ease);
}

/* gap callout */
.gap-callout{
  border:1.5px dashed var(--sun); background:var(--sun-soft);
  border-radius:var(--r-md); padding:11px 13px; margin-top:10px;
}
.gap-callout .gt{
  font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--sun); margin-bottom:6px;
}
.gap-row{ font-size:11px; margin-bottom:5px; line-height:1.5; }
.gap-row .gap-mons{ color:var(--bark-soft); font-size:10px; }

/* suggestions */
.suggest-group-label{
  font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em;
  color:var(--bark-soft); margin:12px 0 6px;
}
.suggest-row{
  display:flex; align-items:center; gap:9px;
  border:1px solid var(--line); border-radius:var(--r-md);
  padding:9px 11px; margin-bottom:6px; background:#fff;
  transition: border-color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
  animation: rowIn var(--t-med) var(--ease);
}
.suggest-row:hover{
  border-color:var(--meadow); transform:translateY(-1px);
  box-shadow: var(--shadow-float);
}
.suggest-row.suggest-conflict{ border-style:dashed; opacity:0.82; }
.suggest-info{ flex:1; min-width:0; }
.suggest-name{ font-size:12.5px; font-weight:700; }
.suggest-hab{
  font-size:9px; font-weight:700; padding:1px 7px; border-radius:var(--r-pill); margin-left:5px;
  background:var(--sky-soft); color:var(--sky);
}
.suggest-shared{ font-size:9.5px; color:var(--bark-soft); margin-top:2px; }
.add-suggest-btn{
  flex-shrink:0; background:var(--meadow); color:#fff; border:none;
  border-radius:var(--r-pill); padding:7px 14px; font-size:11px; font-weight:700; cursor:pointer;
  transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.add-suggest-btn:hover{ background:var(--meadow-deep); transform:scale(1.04); }
.add-suggest-btn:active{ transform:scale(0.96); }

/* browse screen */
.browse-controls{ display:flex; flex-direction:column; gap:8px; }
.browse-search{
  width:100%; padding:11px 14px; font-size:14px;
  border:1.5px solid var(--line-strong); border-radius:var(--r-md);
  background:#fff; color:var(--bark); outline:none;
  transition: border-color var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease);
}
.browse-search:focus{ border-color:var(--meadow); box-shadow:0 0 0 3px var(--meadow-soft); }
.browse-filters{ display:flex; gap:8px; }
.browse-filters select{
  flex:1; padding:9px 10px; font-size:12px;
  border:1.5px solid var(--line-strong); border-radius:var(--r-md);
  background:#fff; color:var(--bark); outline:none; cursor:pointer;
}
.browse-group{ margin-top:14px; }
.browse-group-head{
  display:flex; justify-content:space-between; align-items:baseline;
  font-size:12px; font-weight:800; color:var(--meadow-deep);
  padding-bottom:5px; border-bottom:1.5px solid var(--line);
}
.browse-group-head .cnt{ font-size:10px; font-weight:600; color:var(--bark-soft); }
.mon-row{
  display:flex; justify-content:space-between; font-size:12px;
  padding:7px 4px; border-bottom:1px solid var(--line);
}
.mon-row:last-child{ border-bottom:none; }
.mon-row .mn{ color:var(--bark-soft); font-size:10px; }

/* placeholder */
#placeholderHint{
  text-align:center; padding:34px 20px; color:var(--bark-soft);
  font-size:13px;
}
#placeholderHint .ph-icon{ font-size:30px; display:block; margin-bottom:8px; }

/* scrollbars (webkit) */
.picker-list::-webkit-scrollbar{ width:8px; }
.picker-list::-webkit-scrollbar-thumb{ background:var(--line-strong); border-radius:4px; }

/* ============================================================
   [S4] ANIMATIONS
   ============================================================ */
@keyframes screenIn{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:translateY(0); }
}
@keyframes rowIn{
  from{ opacity:0; transform:translateY(4px); }
  to{ opacity:1; transform:translateY(0); }
}
@keyframes chipIn{
  from{ opacity:0; transform:scale(0.85); }
  to{ opacity:1; transform:scale(1); }
}
@keyframes bodyIn{
  from{ opacity:0; }
  to{ opacity:1; }
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{ animation:none !important; transition:none !important; }
}
</style>
</head>
<body>

<!-- ============================================================
     [S5] MARKUP
     ============================================================ -->
<header>
  <div class="brand">
    <h1>Habitat Planner</h1>
    <div class="sub">Pokopia companion</div>
  </div>
  <nav class="tabs">
    <button id="tabPlanner" class="active">Plan a Habitat</button>
    <button id="tabBrowse">Browse Pokémon</button>
  </nav>
</header>

<main>
  <!-- ===================== PLANNER SCREEN ===================== -->
  <section id="screenPlanner" class="screen active">
    <section class="block">
      <div class="block-title">
        <span>Choose Pokémon</span>
        <span id="targetCount">0 selected</span>
      </div>
      <input type="text" class="picker-search" id="pickerSearch"
             placeholder="Search name, dex # or specialty...">
      <div class="picker-list" id="pickerList"></div>
      <div class="target-chips" id="targetChips"></div>
    </section>

    <section class="block" id="habitatsBlock" style="display:none;">
      <div class="block-title">
        <span>Saved habitats</span>
        <span id="habitatCount"></span>
      </div>
      <div class="habitat-save-row">
        <input type="text" class="habitat-name-input" id="habitatNameInput"
               placeholder="Habitat name..." maxlength="30">
        <button class="habitat-save-btn" id="habitatSaveBtn">Save</button>
      </div>
      <div id="habitatList"></div>
    </section>

    <div id="placeholderHint">
      <span class="ph-icon">🌿</span>
      Pick Pokémon to plan their perfect home.
    </div>

    <div id="resultBlock" style="display:none;">
      <section class="block" id="conflictBlock"></section>

      <section class="block">
        <div class="block-title">
          <span>Item coverage by favorite</span>
          <span id="itemCountLabel"></span>
        </div>
        <div class="coverage-bar" id="coverageBar"></div>
        <div class="coverage-stats" id="coverageStats"></div>
        <div id="itemResultList" style="margin-top:12px;"></div>
        <div id="flavorSpecList" style="margin-top:8px;"></div>
        <div id="gapCallout"></div>
        <div id="suggestList"></div>
      </section>
    </div>
  </section>

  <!-- ===================== BROWSE SCREEN ===================== -->

/* ============================================================
   [S8c] DATA:LITTER DROPS — what each Litter Pokémon drops
   Source: thonky.com/pokemon-pokopia/litter-specialty (April 2026).
   Litter Pokémon passively drop one specific material near their
   habitat. Comfy level raises the drop rate.
   NOTE: source lists 34 Pokémon; 3 of them (Jumpluff, Larvesta,
   Snivy) are not flagged Litter in POKOPIA_DATA — unresolved
   conflict, so their drops are stored but only shown if the
   Pokémon's own spec list contains Litter.
   ============================================================ */
const LITTER_DROPS = {"Altaria":"Fluff","Ariados":"Twine","Aurorus":"Stone","Bastiodon":"Stone","Bellsprout":"Vine Rope","Blissey":"Stone","Cacturne":"Sturdy Stick","Clodsire":"Squishy Clay","Combee":"Honey","Flaaffy":"Fluff","Garbodor":"Nonburnable Garbage","Glimmet":"Iron Ore","Glimmora":"Iron Ore","Grimer":"Nonburnable Garbage","Haxorus":"Small Log","Jumpluff":"Fluff","Larvesta":"Twine","Mareep":"Fluff","Muk":"Nonburnable Garbage","Rampardos":"Stone","Serperior":"Vine Rope","Servine":"Vine Rope","Snivy":"Vine Rope","Spinarak":"Twine","Swablu":"Fluff","Tangela":"Vine Rope","Tangrowth":"Vine Rope","Trapinch":"Squishy Clay","Tyrantrum":"Stone","Venusaur":"Leaf","Vileplume":"Leaf","Volcarona":"Twine","Weepinbell":"Vine Rope","Wooper":"Squishy Clay","Paldean Wooper":"Squishy Clay"};

/* ============================================================
   [S9] DERIVED INDEXES — built once from data at load
   ============================================================ */
const data = POKOPIA_DATA;

// Environment conflict axes. Each house has ONE setting per axis.
// Opposite-pole Pokémon CAN co-house — soft comfort penalty, not a block.
const AXES = [
  { name: 'Light',       poles: ['Bright', 'Dark'] },
  { name: 'Temperature', poles: ['Warm', 'Cool'] },
  { name: 'Humidity',    poles: ['Dry', 'Humid'] },
];
function axisOf(habitatValue){
  for(const ax of AXES){
    if(ax.poles.includes(habitatValue)) return ax;
  }
  return null;
}

// item -> favorite categories reverse index
const ALL_KNOWN_ITEMS_BUILD = {};
for(const [favName, entry] of Object.entries(FAVORITES_ITEMS)){
  for(const item of entry.items){
    if(!ALL_KNOWN_ITEMS_BUILD[item]) ALL_KNOWN_ITEMS_BUILD[item] = new Set();
    ALL_KNOWN_ITEMS_BUILD[item].add(favName);
  }
}
const ITEM_TO_FAVS = ALL_KNOWN_ITEMS_BUILD;
const ALL_KNOWN_ITEMS = Object.keys(ITEM_TO_FAVS);
const CATALOGUED_FAVS = new Set(Object.keys(FAVORITES_ITEMS));

// Renders a specialty name, annotating Litter with the material dropped.
// e.g. "Litter" -> "Litter (Squishy Clay)"
function specLabel(mon, spec){
  if(spec === 'Litter'){
    const drop = LITTER_DROPS[mon.name];
    if(drop) return `Litter (${drop})`;
  }
  return spec;
}

// Case-insensitive furniture-type lookup, resolving name aliases.
// Returns the crafting category (e.g. 'Blocks') or null if unknown.
const FURNITURE_TYPES_LC = {};
for(const [k, v] of Object.entries(FURNITURE_TYPES)) FURNITURE_TYPES_LC[k.toLowerCase()] = v;
function furnitureTypeOf(itemName){
  const n = itemName.toLowerCase();
  if(FURNITURE_TYPES_LC[n]) return FURNITURE_TYPES_LC[n];
  const alias = ITEM_ALIASES[n];
  if(alias && FURNITURE_TYPES_LC[alias.toLowerCase()]) return FURNITURE_TYPES_LC[alias.toLowerCase()];
  return null;
}
const FLAVOR_CATS = new Set(['Sweet Flavors','Sour Flavors','Spicy Flavors','Bitter Flavors','Dry Flavors']);

/* ============================================================
   [S10] STATE
   ============================================================ */
let targetMons = []; // currently selected Pokémon (objects from data)

// ---- Persistence (localStorage with graceful fallback) ----
// Stores: { current: [{n,name}], habitats: { "<name>": [{n,name}] } }
const STORE_KEY = 'pokopia_planner_v1';
function storageAvailable(){
  try{
    const t = '__t';
    localStorage.setItem(t, t);
    localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
const HAS_STORAGE = storageAvailable();

function loadStore(){
  if(!HAS_STORAGE) return { current: [], habitats: {} };
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return { current: [], habitats: {} };
    const parsed = JSON.parse(raw);
    return { current: parsed.current || [], habitats: parsed.habitats || {} };
  }catch(e){ return { current: [], habitats: {} }; }
}
function saveStore(store){
  if(!HAS_STORAGE) return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
}
function monsToRefs(mons){ return mons.map(m=>({ n: m.n, name: m.name })); }
function refsToMons(refs){
  return refs.map(r => data.find(p=>p.n===r.n && p.name===r.name)).filter(Boolean);
}
function persistCurrent(){
  const store = loadStore();
  store.current = monsToRefs(targetMons);
  saveStore(store);
}

/* ============================================================
   [S11] LOGIC — pure functions, no DOM access
   ============================================================ */

// Which of the given Pokémon want a specific favorite category?
function whichMonsWantFav(monsList, favName){
  return monsList.filter(m => m.fav.includes(favName));
}

// Detect environment-axis conflicts within a selection.
// Returns [{axis, poleA, poleB, monsA, monsB}] for every axis where
// both poles are represented.
function detectConflicts(monsList){
  const conflicts = [];
  for(const ax of AXES){
    const byPole = { [ax.poles[0]]: [], [ax.poles[1]]: [] };
    monsList.forEach(m=>{ if(byPole[m.idealHabitat] !== undefined) byPole[m.idealHabitat].push(m); });
    const a = byPole[ax.poles[0]], b = byPole[ax.poles[1]];
    if(a.length > 0 && b.length > 0){
      conflicts.push({ axis: ax.name, poleA: ax.poles[0], poleB: ax.poles[1], monsA: a, monsB: b });
    }
  }
  return conflicts;
}

// Split a selection's favorites into material (item-based) vs flavor (feeding).
function computeFullCoverage(monsList){
  const neededFavs = new Set();
  monsList.forEach(m => m.fav.forEach(f => neededFavs.add(f)));
  const materialFavs = [...neededFavs].filter(f => !FLAVOR_CATS.has(f));
  const flavorFavs = [...neededFavs].filter(f => FLAVOR_CATS.has(f)).sort();
  const catalogued = materialFavs.filter(f => CATALOGUED_FAVS.has(f)).sort();
  const uncatalogued = materialFavs.filter(f => !CATALOGUED_FAVS.has(f)).sort();
  return { neededFavs: materialFavs, catalogued, uncatalogued, flavorFavs };
}

// Suggest non-selected Pokémon that share favorites with the selection.
// Sorted: conflict-free first, then by shared count desc, then dex #.
function computeSuggestions(monsList){
  if(monsList.length === 0) return [];
  const selectedFavs = new Set();
  monsList.forEach(m => m.fav.forEach(f => { if(!FLAVOR_CATS.has(f)) selectedFavs.add(f); }));
  const selectedKeys = new Set(monsList.map(m => m.n+'|'+m.name));
  const selectedPoles = new Set();
  monsList.forEach(m => { if(m.idealHabitat) selectedPoles.add(m.idealHabitat); });

  const scored = [];
  for(const p of data){
    if(selectedKeys.has(p.n+'|'+p.name)) continue;
    const shared = p.fav.filter(f => !FLAVOR_CATS.has(f) && selectedFavs.has(f));
    if(shared.length === 0) continue;
    let conflict = false;
    if(p.idealHabitat){
      const ax = axisOf(p.idealHabitat);
      if(ax){
        const otherPole = ax.poles.find(pole => pole !== p.idealHabitat);
        if(selectedPoles.has(otherPole)) conflict = true;
      }
    }
    scored.push({ mon: p, sharedCount: shared.length, sharedFavs: shared, conflict });
  }
  scored.sort((a,b)=>{
    if(a.conflict !== b.conflict) return a.conflict ? 1 : -1;
    if(b.sharedCount !== a.sharedCount) return b.sharedCount - a.sharedCount;
    return a.mon.n - b.mon.n;
  });
  return scored.slice(0, 12);
}

const pickerSearch = document.getElementById('pickerSearch');
const pickerList = document.getElementById('pickerList');

function renderPickerList(){
  const q = pickerSearch.value.trim().toLowerCase();
  let list = data;
  if(q){
    list = data.filter(p =>
      p.name.toLowerCase().includes(q) ||
      String(p.n).includes(q) ||
      (p.spec && p.spec.some(s => s.toLowerCase().includes(q))) ||
      (p.spec && p.spec.includes('Litter') && LITTER_DROPS[p.name] &&
        LITTER_DROPS[p.name].toLowerCase().includes(q))
    );
  }
  list = list.slice(0, 60);
  pickerList.innerHTML = list.map(p=>{
    const checked = targetMons.find(t=>t.n===p.n && t.name===p.name) ? 'checked' : '';
    const habTag = p.idealHabitat ? `<span class="hab-pole">${p.idealHabitat}</span>` : '';
    const drop = (p.spec && p.spec.includes('Litter')) ? LITTER_DROPS[p.name] : null;
    const dropTag = drop ? `<span class="litter-tag">${drop}</span>` : '';
    return `
      <label class="picker-row">
        <input type="checkbox" data-n="${p.n}" data-name="${p.name.replace(/"/g,'&quot;')}" ${checked}>
        <span class="num">#${String(p.n).padStart(3,'0')}</span>
        <span class="name">${p.name}</span>
        ${dropTag}
        ${habTag}
      </label>
    `;
  }).join('');

  pickerList.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', (e)=>{
      const n = parseInt(e.target.dataset.n);
      const name = e.target.dataset.name;
      const mon = data.find(p=>p.n===n && p.name===name);
      if(e.target.checked){
        if(!targetMons.find(t=>t.n===n && t.name===name)) targetMons.push(mon);
      } else {
        targetMons = targetMons.filter(t=>!(t.n===n && t.name===name));
      }
      renderTargetChips();
      computeAndRenderCoverage();
    });
  });
}

function renderTargetChips(){
  const el = document.getElementById('targetChips');
  document.getElementById('targetCount').textContent = `${targetMons.length} selected`;
  if(targetMons.length === 0){
    el.innerHTML = `<span class="empty-hint">Nothing selected yet.</span>`;
    return;
  }
  const conflictedMonKeys = new Set();
  detectConflicts(targetMons).forEach(c=>{
    const minoritySide = c.monsA.length <= c.monsB.length ? c.monsA : c.monsB;
    minoritySide.forEach(m=>conflictedMonKeys.add(m.n+'|'+m.name));
  });
  el.innerHTML = targetMons.map(m=>{
    const isMinorityConflict = conflictedMonKeys.has(m.n+'|'+m.name);
    return `
    <span class="chip ${isMinorityConflict?'chip-caution':''}" data-n="${m.n}" data-name="${m.name.replace(/"/g,'&quot;')}">
      ${isMinorityConflict ? '⚡ ' : ''}#${String(m.n).padStart(3,'0')} ${m.name}
      <button data-remove="${m.n}|${m.name.replace(/"/g,'&quot;')}">×</button>
    </span>
  `}).join('');
  el.querySelectorAll('button[data-remove]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const [n, name] = btn.dataset.remove.split('|');
      targetMons = targetMons.filter(t=>!(t.n===parseInt(n) && t.name===name));
      renderPickerList();
      renderTargetChips();
      computeAndRenderCoverage();
    });
  });
}

function removeMon(n, name){
  targetMons = targetMons.filter(t=>!(t.n===n && t.name===name));
  renderPickerList();
  renderTargetChips();
  computeAndRenderCoverage();
}

function addMon(n, name){
  const mon = data.find(p=>p.n===n && p.name===name);
  if(mon && !targetMons.find(t=>t.n===n && t.name===name)){
    targetMons.push(mon);
    renderPickerList();
    renderTargetChips();
    computeAndRenderCoverage();
  }
}

function computeAndRenderCoverage(){
  persistCurrent();
  renderHabitats();
  const resultBlock = document.getElementById('resultBlock');
  const placeholder = document.getElementById('placeholderHint');

  if(targetMons.length === 0){
    resultBlock.style.display = 'none';
    placeholder.style.display = 'block';
    return;
  }
  placeholder.style.display = 'none';
  resultBlock.style.display = 'block';

  // ---- 1. Environment conflicts ----
  const conflictBlock = document.getElementById('conflictBlock');
  const conflicts = detectConflicts(targetMons);
  if(conflicts.length === 0){
    conflictBlock.innerHTML = `<div class="ok-callout">✓ No environment conflicts — everyone shares compatible habitat needs.</div>`;
  } else {
    conflictBlock.innerHTML = conflicts.map(c=>`
      <div class="conflict-callout">
        <div class="ct">⚡ ${c.axis} mismatch — comfort penalty</div>
        <div class="cx">
          <b>${c.poleA}:</b> ${c.monsA.map(m=>m.name).join(', ')}<br>
          <b>${c.poleB}:</b> ${c.monsB.map(m=>m.name).join(', ')}
        </div>
      </div>
    `).join('');
  }

  // ---- 2. Coverage summary ----
  const result = computeFullCoverage(targetMons);
  const totalFavs = result.neededFavs.length;
  const coveredCount = result.catalogued.length;
  const gapCount = result.uncatalogued.length;

  document.getElementById('itemCountLabel').textContent = `${totalFavs} favorite categories`;
  const coveredPct = totalFavs ? (coveredCount/totalFavs*100) : 0;
  const gapPct = totalFavs ? (gapCount/totalFavs*100) : 0;
  document.getElementById('coverageBar').innerHTML = `
    <div class="seg covered" style="width:${coveredPct}%"></div>
    <div class="seg gap" style="width:${gapPct}%"></div>
  `;
  document.getElementById('coverageStats').innerHTML = `
    <span>${coveredCount}/${totalFavs} with item data</span>
    ${gapCount ? `<span>${gapCount} without data</span>` : ''}
  `;

  // ---- 3. Item lists per favorite ----
  const itemListEl = document.getElementById('itemResultList');
  itemListEl.innerHTML = result.catalogued.map(favName=>{
    const entry = FAVORITES_ITEMS[favName];
    const mons = whichMonsWantFav(targetMons, favName);
    const statusTag = entry.complete
      ? `<span class="fav-status ok">verified</span>`
      : `<span class="fav-status partial">${entry.items.length}/${entry.count}</span>`;
    return `
      <div class="item-result" data-fav="${favName}">
        <div class="item-head">
          <div>
            <div class="item-name">${favName}</div>
            <div class="item-meta">wanted by: ${mons.map(m=>m.name).join(', ')}</div>
          </div>
          ${statusTag}
          <span class="chev">▾</span>
        </div>
        <div class="item-body">
          <div class="fav-tag-row">${entry.items.map(it=>{
            const ft = furnitureTypeOf(it);
            return `<span class="mon-tag">${it}${ft?`<span class="ft-badge">${ft}</span>`:''}</span>`;
          }).join('')}</div>
        </div>
      </div>
    `;
  }).join('');
  itemListEl.querySelectorAll('.item-result').forEach(el=>{
    el.querySelector('.item-head').addEventListener('click', ()=>{
      el.classList.toggle('expanded');
    });
  });

  // ---- 3b. Flavor & Specialty per Pokémon ----
  const flavorSpecEl = document.getElementById('flavorSpecList');
  flavorSpecEl.innerHTML = targetMons.map(m=>{
    const flavorFav = m.fav.find(f => FLAVOR_CATS.has(f));
    const flavorLabel = flavorFav ? flavorFav.replace(' Flavors','') : '—';
    const specs = (m.spec && m.spec.length) ? m.spec : ['—'];
    return `
      <div class="flavor-spec-mon">
        <div class="fsm-head">
          <div class="item-name">${m.name}</div>
          <button class="remove-mon-btn" data-n="${m.n}" data-name="${m.name.replace(/"/g,'&quot;')}">✕</button>
        </div>
        <div class="flavor-spec-row">
          <div class="flavor-spec-box">
            <span class="flavor-spec-label">Flavor</span>
            <span class="fav-tag" style="align-self:flex-start;">${flavorLabel}</span>
          </div>
          <div class="flavor-spec-box">
            <span class="flavor-spec-label">Specialty</span>
            <span class="fav-tag-row" style="margin:0;">${specs.map(s=>`<span class="fav-tag">${specLabel(m, s)}</span>`).join('')}</span>
          </div>
        </div>
      </div>
    `;
  }).join('');
  flavorSpecEl.querySelectorAll('.remove-mon-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      removeMon(parseInt(btn.dataset.n), btn.dataset.name);
    });
  });

  // ---- 4. Gap callout ----
  const gapEl = document.getElementById('gapCallout');
  if(result.uncatalogued.length === 0){
    gapEl.innerHTML = '';
  } else {
    gapEl.innerHTML = `
      <div class="gap-callout">
        <div class="gt">⚠ No item data for ${result.uncatalogued.length} categor${result.uncatalogued.length===1?'y':'ies'}</div>
        ${result.uncatalogued.map(f=>{
          const mons = whichMonsWantFav(targetMons, f);
          return `<div class="gap-row"><b>${f}</b><br>
            <span class="gap-mons">Needed by: ${mons.map(m=>m.name).join(', ')}</span></div>`;
        }).join('')}
      </div>
    `;
  }

  // ---- 5. Suggestions, grouped by shared-favorite count ----
  const suggestEl = document.getElementById('suggestList');
  const suggestions = computeSuggestions(targetMons);
  if(suggestions.length === 0){
    suggestEl.innerHTML = '';
  } else {
    const byCount = {};
    suggestions.forEach(s=>{
      (byCount[s.sharedCount] = byCount[s.sharedCount] || []).push(s);
    });
    const counts = Object.keys(byCount).map(Number).sort((a,b)=>b-a);
    suggestEl.innerHTML = `
      <div class="block-title" style="margin-top:18px;">
        <span>Suggested Pokémon</span>
        <span>${suggestions.length} match${suggestions.length===1?'':'es'}</span>
      </div>
      ${counts.map(count=>`
        <div class="suggest-group-label">${count} shared favorite${count===1?'':'s'}</div>
        ${byCount[count].map(s=>`
          <div class="suggest-row ${s.conflict?'suggest-conflict':''}">
            <div class="suggest-info">
              <div class="suggest-name">${s.conflict?'⚡ ':''}#${String(s.mon.n).padStart(3,'0')} ${s.mon.name}
                ${s.mon.idealHabitat?`<span class="suggest-hab">${s.mon.idealHabitat}</span>`:''}
              </div>
              <div class="suggest-shared">${s.sharedFavs.join(', ')}</div>
            </div>
            <button class="add-suggest-btn" data-n="${s.mon.n}" data-name="${s.mon.name.replace(/"/g,'&quot;')}">+ Add</button>
          </div>
        `).join('')}
      `).join('')}
    `;
    suggestEl.querySelectorAll('.add-suggest-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        addMon(parseInt(btn.dataset.n), btn.dataset.name);
      });
    });
  }
}

/* ---- Saved habitats ---- */
function renderHabitats(){
  const block = document.getElementById('habitatsBlock');
  if(!HAS_STORAGE){ block.style.display = 'none'; return; }
  block.style.display = 'block';

  const store = loadStore();
  const names = Object.keys(store.habitats).sort();
  document.getElementById('habitatCount').textContent = names.length ? `${names.length} saved` : '';
  document.getElementById('habitatSaveBtn').disabled = targetMons.length === 0;

  const listEl = document.getElementById('habitatList');
  listEl.innerHTML = names.map(name=>{
    const refs = store.habitats[name];
    const monNames = refs.map(r=>r.name).join(', ');
    return `
      <div class="habitat-row">
        <div class="hr-info" data-load="${name.replace(/"/g,'&quot;')}">
          <div class="hr-name">${name}</div>
          <div class="hr-mons">${refs.length} Pokémon — ${monNames}</div>
        </div>
        <button class="hr-load" data-load="${name.replace(/"/g,'&quot;')}">Load</button>
        <button class="hr-del" data-del="${name.replace(/"/g,'&quot;')}">✕</button>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('[data-load]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const store2 = loadStore();
      const refs = store2.habitats[el.dataset.load];
      if(!refs) return;
      targetMons = refsToMons(refs);
      persistCurrent();
      renderPickerList();
      renderTargetChips();
      computeAndRenderCoverage();
    });
  });
  listEl.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const store2 = loadStore();
      delete store2.habitats[btn.dataset.del];
      saveStore(store2);
      renderHabitats();
    });
  });
}

/* ---- Browse screen ---- */
function renderBrowse(){
  const q = document.getElementById('browseSearch').value.trim().toLowerCase();
  const favFilter = document.getElementById('filterFav').value;
  const habFilter = document.getElementById('filterHab').value;

  let list = data;
  if(q){
    list = list.filter(p =>
      p.name.toLowerCase().includes(q) ||
      (p.hab||'').toLowerCase().includes(q) ||
      p.fav.some(f=>f.toLowerCase().includes(q))
    );
  }
  if(favFilter) list = list.filter(p=>p.fav.includes(favFilter));
  if(habFilter) list = list.filter(p=>p.idealHabitat===habFilter);

  // group by favorite, count desc
  const groups = {};
  list.forEach(p=>{
    p.fav.forEach(f=>{
      if(favFilter && f!==favFilter) return;
      (groups[f] = groups[f] || []).push(p);
    });
  });
  const sorted = Object.entries(groups).sort((a,b)=>b[1].length-a[1].length);

  document.getElementById('browseResults').innerHTML = sorted.map(([fav, mons])=>`
    <div class="browse-group">
      <div class="browse-group-head">
        <span>${fav}</span>
        <span class="cnt">${mons.length} Pokémon</span>
      </div>
      ${mons.map(m=>`<div class="mon-row"><span>${m.name}</span><span class="mn">#${String(m.n).padStart(3,'0')}</span></div>`).join('')}
    </div>
  `).join('');
}

/* ============================================================
   [S13] EVENTS & INIT
   ============================================================ */
pickerSearch.addEventListener('input', renderPickerList);

document.getElementById('tabPlanner').addEventListener('click', ()=>{
  document.getElementById('tabPlanner').classList.add('active');
  document.getElementById('tabBrowse').classList.remove('active');
  document.getElementById('screenPlanner').classList.add('active');
  document.getElementById('screenBrowse').classList.remove('active');
});
document.getElementById('tabBrowse').addEventListener('click', ()=>{
  document.getElementById('tabBrowse').classList.add('active');
  document.getElementById('tabPlanner').classList.remove('active');
  document.getElementById('screenBrowse').classList.add('active');
  document.getElementById('screenPlanner').classList.remove('active');
  renderBrowse();
});

document.getElementById('browseSearch').addEventListener('input', renderBrowse);
document.getElementById('filterFav').addEventListener('change', renderBrowse);
document.getElementById('filterHab').addEventListener('change', renderBrowse);

// populate browse filters
(function initFilters(){
  const favSel = document.getElementById('filterFav');
  const habSel = document.getElementById('filterHab');
  const allFavs = new Set(), allHabs = new Set();
  data.forEach(p=>{
    p.fav.forEach(f=>allFavs.add(f));
    if(p.idealHabitat) allHabs.add(p.idealHabitat);
  });
  [...allFavs].sort().forEach(f=>{
    favSel.insertAdjacentHTML('beforeend', `<option value="${f}">${f}</option>`);
  });
  [...allHabs].sort().forEach(h=>{
    habSel.insertAdjacentHTML('beforeend', `<option value="${h}">${h}</option>`);
  });
})();

// saved habitats: save button
document.getElementById('habitatSaveBtn').addEventListener('click', ()=>{
  const input = document.getElementById('habitatNameInput');
  const name = input.value.trim();
  if(!name || targetMons.length === 0) return;
  const store = loadStore();
  store.habitats[name] = monsToRefs(targetMons);
  saveStore(store);
  input.value = '';
  renderHabitats();
});
document.getElementById('habitatNameInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('habitatSaveBtn').click();
});

// boot: restore last selection, then render everything
(function boot(){
  const store = loadStore();
  if(store.current && store.current.length){
    targetMons = refsToMons(store.current);
  }
  renderPickerList();
  renderTargetChips();
  computeAndRenderCoverage();
})();
</script>
